<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BISCUIT Post Scheduler</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card">
      <img src="/favicon.svg" alt="" width="48" height="48">
      <h1>Post Scheduler</h1>
      <p class="muted">Self-hosted Instagram scheduling for BISCUIT.</p>
      <label>Dashboard password
        <input type="password" name="password" autocomplete="current-password" required autofocus>
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary" type="submit">Log in</button>
    </form>
  </main>

  <!-- Dashboard -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand"><img src="/favicon.svg" alt="" width="28" height="28"> <strong>BISCUIT</strong> <span class="muted">Post Scheduler</span></div>
      <div class="topbar-actions">
        <span id="mode-pill" class="pill">…</span>
        <button id="check-btn" class="btn ghost" type="button">Test connection</button>
        <button id="logout-btn" class="btn ghost" type="button">Log out</button>
      </div>
    </header>
    <p id="banner" class="banner" role="status" hidden></p>
    <div id="token-note" class="token-note" hidden>
      <span id="token-text"></span>
      <button id="renew-btn" class="btn small ghost" type="button" hidden>Renew now</button>
    </div>

    <main class="layout">
      <section class="card compose" aria-labelledby="compose-title">
        <h2 id="compose-title">New post</h2>
        <form id="post-form">
          <fieldset class="seg">
            <legend class="sr-only">Media type</legend>
            <label><input type="radio" name="mediaType" value="IMAGE" checked> Image</label>
            <label><input type="radio" name="mediaType" value="REELS"> Reel (video)</label>
          </fieldset>

          <label>Media URL
            <input type="url" name="mediaUrl" placeholder="https://…/artwork.jpg" required pattern="https://.*">
            <small class="muted">Must be a public https link. Instagram downloads the file from it. Images: JPEG. Reels: MP4.</small>
          </label>

          <label>Caption
            <textarea name="caption" rows="6" maxlength="2200" placeholder="New wallpaper drop ✨ #biscuitart"></textarea>
            <small class="counters"><span id="c-chars">0/2200</span> · <span id="c-tags">0/30 hashtags</span> · <span id="c-mentions">0/20 mentions</span></small>
          </label>

          <label>Publish at
            <input type="datetime-local" name="publishAt" required>
            <small class="muted" id="tz-note"></small>
          </label>

          <p class="error" id="form-error" role="alert"></p>
          <div class="row">
            <button class="btn primary" type="submit">Schedule post</button>
            <button class="btn ghost" type="button" id="now-btn">Set to now</button>
          </div>
        </form>
      </section>

      <section class="preview-wrap" aria-label="Preview">
        <div class="phone">
          <div class="ig-head"><span class="avatar"></span><strong>biscuit</strong></div>
          <div class="ig-media" id="preview-media"><span class="muted">Preview appears here</span></div>
          <p class="ig-caption" id="preview-caption"><strong>biscuit</strong> <span></span></p>
        </div>
      </section>

      <section class="card queue" aria-labelledby="queue-title">
        <div class="queue-head">
          <h2 id="queue-title">Queue</h2>
          <div class="tabs" role="tablist">
            <button role="tab" data-filter="upcoming" aria-selected="true">Upcoming</button>
            <button role="tab" data-filter="published" aria-selected="false">Published</button>
            <button role="tab" data-filter="failed" aria-selected="false">Failed</button>
          </div>
        </div>
        <ul id="queue-list" class="queue-list"></ul>
        <p id="queue-empty" class="muted empty" hidden>Nothing here yet.</p>
      </section>
    </main>

    <footer class="foot muted">Open source (MIT). Uses Meta's official Instagram Content Publishing API. Business or Creator accounts only.</footer>
  </div>
</body>
</html>
